<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Encabezado común de todas las páginas -->
<head th:fragment="cabeza(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Las Torres'">Las Torres</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<!-- Barra de navegación: el menú cambia según el rol -->
<header class="barra" th:fragment="barra">
    <a class="marca" th:href="@{/}">Las <span>Torres</span></a>
    <nav class="menu">
        <th:block th:unless="${esResidente}">
            <a th:href="@{/caseta}">Caseta</a>
            <a th:href="@{/bitacora}">Bitácora</a>
        </th:block>
        <a th:if="${esAdmin}" th:href="@{/solicitudes}">Solicitudes<span class="insignia"
                th:if="${solicitudesPendientes > 0}" th:text="${solicitudesPendientes}">0</span></a>
        <a th:if="${esAdmin}" th:href="@{/visitantes}">Visitantes</a>
        <a th:if="${esAdmin}" th:href="@{/residentes}">Residentes</a>
        <a th:if="${esAdmin}" th:href="@{/viviendas}">Viviendas</a>
        <th:block th:if="${esResidente}">
            <a th:href="@{/mis-visitantes}">Mis visitantes</a>
            <a th:href="@{/mis-visitas}">Mis visitas</a>
        </th:block>
    </nav>
    <div class="sesion">
        <span th:text="${usuarioActual}">usuario</span>
        <span class="etiqueta-rol" th:text="${rolActual}">Rol</span>
        <form th:action="@{/logout}" method="post">
            <button class="boton boton-chico boton-claro" type="submit">Salir</button>
        </form>
    </div>
</header>

<!-- Mensajes de éxito o error después de una acción -->
<div th:fragment="avisos">
    <div class="aviso aviso-exito" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="aviso aviso-error" th:if="${error}" th:text="${error}"></div>
</div>

</body>
</html>
