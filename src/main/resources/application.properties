spring.application.name=condominios-las-torres

# Puerto configurable; por defecto 8081 (el 8080 suele estar ocupado)
server.port=${PORT:8081}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Base de datos PostgreSQL en Neon.
# Las credenciales se leen de variables de entorno, nunca se escriben aquí:
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pocas conexiones: alcanza para el proyecto y cuida el plan gratis de Neon
spring.datasource.hikari.maximum-pool-size=5

# Hibernate crea y actualiza las tablas a partir de las entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Archivos subidos (comprobantes). El sistema solo acepta hasta 2 MB: lo revisa la página
# antes de enviar y el código al recibir. Estos límites cortan de raíz archivos enormes.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=12MB

# URL pública del sistema, para los enlaces de los correos (en Render se toma sola)
app.url=${APP_URL:${RENDER_EXTERNAL_URL:http://localhost:8081}}

# Correos con Brevo (API HTTP; Render gratis bloquea SMTP).
# Si no se configuran, los correos no se envían: solo se escriben en el log.
notificaciones.brevo.api-key=${BREVO_API_KEY:}
notificaciones.remitente=${MAIL_FROM:}
notificaciones.remitente-nombre=Condominio Las Torres
