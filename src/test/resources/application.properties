# Configuración SOLO para las pruebas automáticas (gradlew test):
# usan una base de datos en memoria (H2) para no tocar los datos reales de Neon.
spring.application.name=condominios-las-torres-pruebas
spring.datasource.url=jdbc:h2:mem:pruebas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
