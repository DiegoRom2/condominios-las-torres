# Levanta el sistema completo en una sola computadora, sin depender de Neon ni de Render:
#   - db:  una base de datos PostgreSQL propia, dentro de Docker
#   - app: la aplicación, construida con nuestro Dockerfile
#
# Uso (en la carpeta del proyecto):
#   docker compose up --build     -> construye y arranca todo (http://localhost:8081)
#   Ctrl + C                      -> lo detiene
#   docker compose down           -> borra los contenedores (los datos se conservan)
#   docker compose down -v        -> borra también los datos de la base local
#
# Los usuarios iniciales (admin y guardia) toman sus contraseñas de las variables
# de entorno ADMIN_PASSWORD y GUARDIA_PASSWORD de tu computadora.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lastorres
      POSTGRES_USER: lastorres
      # Esta base solo es accesible dentro de Docker (no se publica ningún puerto)
      POSTGRES_PASSWORD: ${DB_PASSWORD_LOCAL:-lastorres-local}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastorres -d lastorres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      # Se conecta a la base "db" de arriba, NO a Neon
      DB_URL: jdbc:postgresql://db:5432/lastorres
      DB_USER: lastorres
      DB_PASSWORD: ${DB_PASSWORD_LOCAL:-lastorres-local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GUARDIA_PASSWORD: ${GUARDIA_PASSWORD:-}
      APP_URL: http://localhost:8081
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos-postgres:
