plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'mx.unam.aragon.tsp.lastorres'
version = '0.0.1-SNAPSHOT'
description = 'Control de acceso para el condominio Las Torres'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Validaciones de los DTOs de entrada (@NotBlank, @Email, etc.)
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Swagger para probar la API desde el navegador: /swagger-ui.html
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

	// Getters, setters y constructores
	compileOnly 'org.projectlombok:lombok:1.18.48'
	annotationProcessor 'org.projectlombok:lombok:1.18.48'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Siguiente avance (base de datos en Neon):
	// implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// runtimeOnly 'org.postgresql:postgresql'
}

// Para que los acentos y la ñ se compilen bien también en Windows
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
}
